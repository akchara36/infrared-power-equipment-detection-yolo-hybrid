nc: 13

scales:
  n: [0.60, 0.90, 640]

# --------------------
# BACKBONE
# --------------------

backbone:
  - [-1, 1, GhostConv, [48, 3, 2]]        # P1/2 (kept low for FLOPs)
  - [-1, 1, GhostConv, [96, 3, 2]]        # P2/4
  - [-1, 1, C3k2, [128, False, 0.25]]

  - [-1, 1, GhostConv, [128, 3, 2]]       # P3/8
  - [-1, 1, C3k2, [160, False, 0.25]]

  - [-1, 1, GhostConv, [160, 3, 2]]       # P4/16
  - [-1, 1, C3k2, [192, False, 0.25]]

  - [-1, 1, GhostConv, [192, 3, 2]]       # P5/32
  - [-1, 1, C3k2, [224, True]]

# --------------------
# HEAD
# --------------------

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 1, C3k2, [144, False, 0.25]]     # reduced to control FLOPs after upsample

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 1, C3k2, [112, False, 0.25]]     # further FLOP cut

  - [-1, 1, GhostConv, [112, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 1, C3k2, [144, False, 0.25]]

  - [-1, 1, GhostConv, [144, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 1, C3k2, [176, True]]

  - [[14, 17, 20], 1, Detect, [nc]]
