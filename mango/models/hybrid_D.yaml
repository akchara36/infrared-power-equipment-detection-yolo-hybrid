


nc: 13  # <-- your dataset classes

# Scaling
scales:
  n: [0.50, 0.38, 512]

# -----------------------
# BACKBONE
# -----------------------
backbone:
  - [-1, 1, GhostConv, [48, 3, 2]]       # P1/2
  - [-1, 1, GhostConv, [96, 3, 2]]       # P2/4
  - [-1, 2, C3k2,     [128, False, 0.25]]

  - [-1, 1, GhostConv, [128, 3, 2]]      # P3/8
  - [-1, 2, C3k2,     [192, False, 0.25]]

  - [-1, 1, GhostConv, [192, 3, 2]]      # P4/16
  - [-1, 2, C3k2,     [256, False, 0.25]]

  - [-1, 1, GhostConv, [256, 3, 2]]      # P5/32
  - [-1, 2, C3k2,     [320, True]]

# -----------------------
# HEAD
# -----------------------
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [192, False, 0.25]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [128, False, 0.25]]

  - [-1, 1, GhostConv, [128, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 2, C3k2, [192, False, 0.25]]

  - [-1, 1, GhostConv, [192, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]]

  - [[14, 17, 20], 1, Detect, [nc]]
